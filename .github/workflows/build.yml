# Does this patch compile?
#
# Until this workflow existed, the repo's only automation SCANNED the text of
# a diff and explicitly never executed anything, so an outside contributor
# could open a pull request and neither they nor the maintainers learned
# whether the code even built. That is the credibility gap this file closes.
#
# ── Security posture (copied from pr-security-review.yml, then extended) ──
#   * trigger is `pull_request`, NOT `pull_request_target`. Fork PRs run in
#     the UNTRUSTED context: read-only GITHUB_TOKEN, no repo secrets, no
#     write access to anything. That is the only context in which it is safe
#     to COMPILE a stranger's code, and compiling is the entire point here —
#     unlike the two security workflows, which deliberately never execute PR
#     code because they hold (or feed) a privileged step.
#   * `persist-credentials: false` on every checkout — the job never holds a
#     git credential.
#   * no `secrets` are referenced anywhere in this file. Adding one later
#     would break the posture above; don't.
#   * dependency CACHE is restore-only on pull requests and written only from
#     a push to the default branch, so a hostile PR cannot poison the cache
#     that later runs consume.
#   * nothing here comments on, labels, or otherwise writes to the PR. The
#     pass/fail check IS the signal.
#
# Leave pr-security-review.yml and pr-security-comment.yml alone; they run
# independently and this workflow neither replaces nor feeds them.

name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read          # minimal; intentionally NO write, NO secrets

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1 — THE CREDIBILITY JOB ────────────────────────────────────────
  # Answers "does this patch compile" for every pull request, under BOTH
  # compilers, with no dependency build at all: a whole-tree -fsyntax-only
  # pass needs only the C sources, the in-tree headers, and the two system
  # dev packages the sources include directly. Measured 3 s wall over 1174
  # translation units at 32 workers on the dev reference host, so even a
  # 4-vCPU hosted runner finishes it in well under a minute.
  compile-check:
    name: compile-check (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false      # a clang failure must not hide a gcc failure
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the syntax pass scopes its verdict to the files this
          # pull request actually changed (see below), which needs the base
          # commit present.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the direct system headers the sources include
        run: |
          sudo apt-get update -qq
          # zlib.h + <openssl/*.h> are included directly by four TUs
          # (lib/sim/src/postmortem.c, lib/wallet/src/wallet_keystore.c,
          # lib/net/src/https_server.c, lib/rpc/src/httpserver.c). The real
          # build uses the vendored OpenSSL instead; for a syntax pass the
          # distribution headers are equivalent and cost seconds, not the
          # from-source dependency build Job 2 pays for.
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libssl-dev

          # ubuntu-latest's default `clang` (18) rejects the "vaes"/"sha"
          # __builtin_cpu_supports() feature strings that lib/util/src/hw_profile.c
          # uses and that GCC — and clang 20 — both accept (this is the exact
          # skew tools/lint/check_clang_portability.sh's own header comment
          # already documents and SKIPs around). The portability ratchet
          # baseline was recorded against clang 20.1.8, and clang-20 is in
          # the Ubuntu 24.04 (noble) archive, so pin that instead of
          # whatever `clang` happens to resolve to.
          sudo apt-get install -y --no-install-recommends clang-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --set clang /usr/bin/clang-20

          if [ "${{ matrix.cc }}" = "gcc" ]; then
            # ubuntu-latest's default `gcc` (13) rejects -std=c23 outright
            # ("did you mean '-std=c2x'?") — GCC only accepted the `c23`
            # spelling itself starting with GCC 14. This project is C23-only
            # by policy, so the runner's compiler is what moves: gcc-14 is
            # in the Ubuntu 24.04 (noble) archive already enabled on this
            # image, and `update-alternatives` repoints the plain `cc`/`gcc`
            # names the Makefile and every gate script invoke, so nothing
            # downstream needs to know a non-default compiler is in play.
            sudo apt-get install -y --no-install-recommends gcc-14
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
            sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100
            sudo update-alternatives --set gcc /usr/bin/gcc-14
            sudo update-alternatives --set cc /usr/bin/gcc-14
          fi

          ${{ matrix.cc }} --version

      - name: Compute the changed-file scope (pull requests only)
        id: scope
        run: |
          set -eu
          # On a pull request the verdict is scoped to the files the patch
          # touches: those must be diagnostic-FREE. Pre-existing diagnostics
          # elsewhere stay advisory, because this runner's compiler is a
          # different VERSION from the one the ratchet baseline was recorded
          # with and version skew must never fail a contributor's patch.
          #
          # On push/dispatch there is no diff, so the gate runs its full-tree
          # ratchet — the strict mode `make lint` uses on the dev host.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=d \
              '${{ github.event.pull_request.base.sha }}' HEAD \
              -- '*.c' '*.h' > changed.txt
            echo "scope=$PWD/changed.txt" >> "$GITHUB_OUTPUT"
            echo "Changed C files in this pull request:"
            cat changed.txt
          else
            echo "scope=" >> "$GITHUB_OUTPUT"
            echo "not a pull request — running the full-tree ratchet"
          fi

      - name: Whole-tree syntax pass (${{ matrix.cc }})
        env:
          ZCL_CC: ${{ matrix.cc }}
          ZCL_PORTABILITY_SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          # --self-test first: proves the flag set still REJECTS a planted
          # violation, so a mis-built flag set cannot report a hollow pass.
          tools/lint/check_clang_portability.sh --self-test
          tools/lint/check_clang_portability.sh

  # ── JOB 2 — the fuller build, on cached dependencies ───────────────────
  # SCOPE, and what is deliberately NOT here:
  #   INCLUDED  `make vendor-ready` — builds every pinned dependency from a
  #             SHA256-verified tarball (OpenSSL, SQLite, libevent, LevelDB,
  #             zlib) and then independently audits the installed bytes.
  #   INCLUDED  `make build-only` — compiles every node translation unit with
  #             GCC against those real vendored headers. Non-LTO and per-TU,
  #             so it genuinely parallelizes and gives real "it builds"
  #             evidence for the cost of a compile.
  #   EXCLUDED  `make ci` as a whole. It pulls in `bench-regress`, which is a
  #             timing measurement — on a shared hosted runner with noisy
  #             neighbours that is a coin flip, not a gate. Coverage is
  #             likewise excluded: it is a second instrumented rebuild for a
  #             number nobody reads on a PR.
  #   EXCLUDED  the whole-program LTO link (`make z23`): one `cc` over
  #             ~1200 files at -O3 with -flto=auto, a multi-GB,
  #             tens-of-minutes step on a 4-vCPU runner.
  #   EXCLUDED  `make test-parallel`. READ THIS BEFORE RE-DECIDING IT: the
  #             reason above no longer applies to the suite. This comment used
  #             to justify excluding it by calling it that same whole-program
  #             LTO `cc`, and that stopped being true when test_parallel moved
  #             to a per-TU, depfile-tracked, NON-LTO object tree — see the
  #             "Cached STRICT test_parallel" block in Makefile, which drops
  #             -flto=auto on purpose so each TU is compiled and cached
  #             independently; the monolith survives only as the separate
  #             `test_parallel_wpo` target. What is still a real open question
  #             is hosted runner capacity and how much of the corpus assumes a
  #             maintainer-host environment. Measure those; do not inherit this
  #             comment's stale answer.
  #
  # So, precisely, who gates what — and the MACHINE-CHECKED version of this
  # paragraph is .github/verification-coverage.txt, held to the job list below
  # by the lint gate check-verification-coverage. Read that file rather than
  # counting jobs here: unheld prose in a comment is exactly what rotted above.
  #   HOSTED CI (this file) runs five jobs and nothing else — compile-check
  #             under GCC and under clang, `build` (a full per-TU compile of
  #             every node translation unit), `lint` (`make lint`), and
  #             `fuzz-replay` over the saved findings. THE TEST SUITE IS NOT
  #             AMONG THEM: five green checks on a commit do NOT mean that
  #             commit's tests passed.
  #   LOCALLY   the two excluded steps are gated by the pre-push hook
  #             (`tools/githooks/pre-push`) and by hand at merge. Do not read
  #             the hook as a full-suite gate: it defaults to
  #             `make pre-push-ci` -> `make fast-ci`, which compiles the
  #             changed files and runs the FOCUSED tests for them, and it is
  #             overridable with `ZCL_PREPUSH_CMD`. The whole suite
  #             (`make test-parallel`) and the LTO link are run deliberately,
  #             by a person, before a merge — `tools/ship.sh` also runs both
  #             before it will deploy anything.
  #
  # This comment used to point at a `zcl-remote-verify.sh` "which is where they
  # already run." No such script has ever existed in this repository — it named
  # a gate nobody could run, which is the same class of defect as prose that
  # describes a recording nothing performs.
  #   EXCLUDED  `make ci-symbol-floor` — it inspects the LINKED binary, so it
  #             follows the LTO link out of this job.
  build:
    name: build (cached dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential perl
          # Same fix as the compile-check job: ubuntu-latest's default gcc
          # (13) does not accept -std=c23, which every recipe in this
          # Makefile passes. gcc-14 does. Repoint the plain `cc`/`gcc` names
          # so `make vendor-ready` / `make build-only` need no CC= override.
          sudo apt-get install -y --no-install-recommends gcc-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set cc /usr/bin/gcc-14
          gcc --version

      # The first dependency build fetches pinned tarballs and compiles
      # OpenSSL from source — minutes, and network-dependent. The cache key is
      # the hash of the pin file itself (tools/scripts/build_vendor.sh holds
      # every URL + SHA256) plus the patches applied to them, so bumping a pin
      # invalidates the cache exactly when it should and never otherwise.
      - name: Restore vendored dependencies
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/lib
            vendor/include
            vendor/provenance
          key: vendor-${{ runner.os }}-${{ hashFiles('tools/scripts/build_vendor.sh', 'vendor/patches/**') }}

      - name: Build/repair + audit vendored dependencies
        run: |
          # Runs even on a cache hit: it is incremental (provenance stamps
          # decide what to rebuild) and `make vendor-ready` also runs the
          # independent byte audit over whatever the cache handed us. A stale
          # or partial cache therefore self-repairs instead of poisoning the
          # build.
          make vendor-ready

      # Cache WRITE only from the default branch. A fork pull request must
      # never be able to place bytes that a later run consumes.
      - name: Save vendored dependencies
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/lib
            vendor/include
            vendor/provenance
          key: ${{ steps.vendor-cache.outputs.cache-primary-key }}

      - name: Compile every node translation unit
        run: make build-only -j"$(nproc)"

  # ── JOB 3 — the lint umbrella, on its own honest budget ────────────────
  # Used to be a step inside JOB 1 on the strength of "12.7 s wall at 8 jobs
  # on the dev reference host" for the umbrella as a whole. That number is
  # real but hid an extreme skew: measured on the dev host (2026-07-29,
  # ZCL_LINT_VERBOSE=1), one gate — check-standalone-tools-link — is 93% of
  # the umbrella's wall time on its own:
  #
  #     227851 ms  check-standalone-tools-link   <- 93% of the 245591 ms run
  #      21031 ms  check-silent-errors-bool
  #      19984 ms  check-build-epoch-integrity
  #      ...
  #
  # Why that one gate is different in kind, not just slow: every other gate
  # is a text/AST scan. This one compiles-and-links every standalone tool
  # binary the Makefile knows how to build, to catch a rule that rotted (see
  # the header comment in tools/lint/check_standalone_tools_link.sh for the
  # incident that motivated it). It is deliberately build-dependent — that
  # is the entire point of the check — so it cannot be made fast the way every
  # other gate in LINT_GATES is fast, and folding it into JOB 1's tight budget
  # meant one compile-heavy gate was dragging every free text scan behind it
  # and, on a cold hosted runner with no vendored dependency and no ccache, blew
  # straight through a 15-minute job timeout without printing a verdict at
  # all (confirmed on this branch: cancelled at the timeout, only this one
  # gate of 116 still in flight).
  #
  # Fix: give it a separate job with vendored deps restored from the SAME
  # cache JOB 2 populates (never rebuilt from source twice) and a timeout
  # sized off the measurement above, not a guess.
  lint:
    name: lint (make lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential perl
          # Same fix as the other two jobs — see their comments. gcc-14 for
          # -std=c23; clang-20 because `make lint` both runs the
          # check-clang-portability ratchet (baselined against clang 20.1.8)
          # and, inside check-standalone-tools-link, builds the fuzz targets
          # with FUZZ_CC=clang — an older clang rejects builtins this tree
          # uses. libclang-rt-20-dev is the separate package that carries
          # the sanitizer/fuzzer runtime archives (libclang_rt.fuzzer.a,
          # libclang_rt.asan*.a) those fuzz targets link against — the
          # `clang-20` compiler package alone does not include them.
          sudo apt-get install -y --no-install-recommends \
            gcc-14 clang-20 libclang-rt-20-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --set clang /usr/bin/clang-20
          gcc --version
          clang --version

      # Restore-only: JOB 2 is the sole writer (same key, same condition —
      # push to main only). This job never builds vendor from source when
      # JOB 2 has already populated the cache for this pin set; on a cache
      # miss `make lint` self-repairs it via the same vendor-ready path JOB 2
      # uses (see that job's comment), just without a cache to save it back to.
      - name: Restore vendored dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/lib
            vendor/include
            vendor/provenance
          key: vendor-${{ runner.os }}-${{ hashFiles('tools/scripts/build_vendor.sh', 'vendor/patches/**') }}

      - name: make lint
        env:
          ZCL_LINT_VERBOSE: "1"
          # check-systemd-memory-budget sums the deploy/*.service MemoryMax
          # caps and fails if they reach/exceed a percentage of REAL host
          # memory — a fact about the actual deploy target (the maintainer
          # host, the
          # 32-core/93 GB box cited as the "dev reference host" throughout
          # this repo's docs and this very workflow's comments), not about
          # whatever RAM a given hosted CI runner happens to have. Reading
          # the runner's own /proc/meminfo here would make the verdict
          # depend on GitHub's instance size instead of the box these units
          # actually deploy to — the same class of environment mismatch the
          # clang-portability gate already documents and sidesteps for
          # compiler version skew. Pin the real target's MemTotal instead.
          # Re-measure with `awk '/MemTotal/{print $2*1024}' /proc/meminfo`
          # on the deploy host if this ever needs updating.
          ZCL_SYSTEMD_MEMORY_BUDGET_MEMTOTAL_BYTES: "100300546048"
        run: make lint

  # ── JOB 4 — saved fuzz findings must not still reproduce ───────────────
  # Why this is a job and not a lint gate. On 2026-07-14 a fuzzer found that a
  # five-byte script from any peer hangs the node forever. The bytes were
  # committed to lib/test/fuzz_seeds/script/ and read by nobody for two weeks.
  # Three mechanisms had already replayed them and already gone red — `make
  # fuzz-ci`, the hourly background quality lane, and the artifact promoter —
  # and not one of them could fail a build. `make fuzz-ci` in particular is
  # reachable only from `make ci`, which this workflow deliberately excludes as
  # a whole (see JOB 2's comment) and which no hook or timer runs either. So the
  # capability was never missing; the verdict had nowhere to go. This job is
  # where it goes.
  #
  # Cost, measured on the dev reference host: the replay is 18.3 s for 22
  # artifacts at -P6, but the nine libFuzzer+ASan binaries it needs are 5 min
  # 45 s at -j6 — one clang per binary over ~1174 TUs, no per-TU object cache,
  # and 742 MB of output. That build is the entire cost, which is exactly why
  # this cannot ride along in JOB 3's budget and why `make lint` runs only the
  # 21 ms ledger half (check-fuzz-artifact-ledger).
  #
  # Same toolchain as JOB 3: clang-20 plus libclang-rt-20-dev, which carries the
  # libclang_rt.fuzzer/asan archives the targets link against. Vendor cache is
  # restore-only — JOB 2 is the sole writer.
  fuzz-replay:
    name: fuzz-replay (saved findings)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential perl gcc-14 clang-20 libclang-rt-20-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --set clang /usr/bin/clang-20
          clang --version

      - name: Restore vendored dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/lib
            vendor/include
            vendor/provenance
          key: vendor-${{ runner.os }}-${{ hashFiles('tools/scripts/build_vendor.sh', 'vendor/patches/**') }}

      - name: Build the fuzz targets and replay every saved artifact
        run: make fuzz-replay -j"$(nproc)"

  # ── JOB 5 — the test suite, bound to the commit ────────────────────────
  # WHY THIS EXISTS. Until this job, four green checks on a commit did not
  # include the test suite, and .github/verification-coverage.txt had to carry
  # `tests|no` with the honest note that the suite runs only on a maintainer
  # host, bound to no commit — so a reader who does not trust this machine had
  # no way to tell whether any given commit's tests passed. That is the gap.
  #
  # JOB 2's comment excluded the suite for years on the strength of a reason
  # that had gone stale (it called the suite a whole-program LTO link, which it
  # stopped being when test_parallel moved to a per-TU, depfile-tracked,
  # non-LTO object tree). That comment also named the one thing still genuinely
  # unknown — hosted runner capacity, and how much of the corpus assumes the
  # maintainer host — and told the next person to MEASURE it rather than
  # inherit an answer. This job is that measurement, run in the open where its
  # result is a check attached to a commit.
  #
  # Two things to expect, and to read honestly rather than paper over:
  #   * TIME. The dev reference host runs the suite in ~15 min at 32 workers.
  #     A 4-vCPU runner compiles ~1400 translation units first, so the budget
  #     here is sized generously; if it times out, the honest fix is a smaller
  #     hosted scope declared in verification-coverage.txt, NOT a quietly
  #     reduced corpus.
  #   * ENVIRONMENT. Parts of this corpus were written on a host that has a
  #     live node, a legacy zclassicd datadir, and a populated ~/.zclassic-c23.
  #     A hosted runner has none of those. Groups that self-skip here are
  #     reporting a real coverage difference between the two environments —
  #     that difference belongs in verification-coverage.txt, not hidden.
  #
  # The verdict is token-gated, not exit-code-gated: `make test-parallel` is
  # required to print ALL TESTS PASSED and to NOT print SOME TESTS FAILED,
  # checked over the FULL captured output. A narrow tail/grep has produced a
  # false green in this project before.
  tests:
    name: tests (make test-parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential perl gcc-14
          # Same -std=c23 reason as every other job here: ubuntu-latest's
          # default gcc (13) rejects the `c23` spelling outright.
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set cc /usr/bin/gcc-14
          gcc --version

      # Restore-only: JOB 2 is the sole writer (same key, same push-to-main
      # condition). On a miss the suite's own vendor-ready path self-repairs.
      - name: Restore vendored dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/lib
            vendor/include
            vendor/provenance
          key: vendor-${{ runner.os }}-${{ hashFiles('tools/scripts/build_vendor.sh', 'vendor/patches/**') }}

      - name: make test-parallel
        run: |
          set -o pipefail
          make test-parallel -j"$(nproc)" 2>&1 | tee /tmp/suite.log

      - name: Gate on the verdict token, over the full output
        run: |
          set -eu
          # Both directions matter. Presence of the pass token alone is not
          # enough: a partial run can print a per-group pass line while the
          # suite as a whole failed elsewhere in the output.
          if ! grep -q 'ALL TESTS PASSED' /tmp/suite.log; then
            echo "FAIL: 'ALL TESTS PASSED' absent from the full suite output"
            exit 1
          fi
          if grep -q 'SOME TESTS FAILED' /tmp/suite.log; then
            echo "FAIL: 'SOME TESTS FAILED' present in the full suite output"
            grep -n 'SOME TESTS FAILED' /tmp/suite.log
            exit 1
          fi
          grep -E 'SUITE VERDICT' /tmp/suite.log || true
          echo "verdict tokens agree: PASSED present, FAILED absent"

      - name: Publish the suite log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-parallel-log-${{ github.sha }}
          path: /tmp/suite.log
          retention-days: 14

  # ── JOB 6 — THE NEW-READER JOB ─────────────────────────────────────────
  # Runs the exact three commands the README gives a stranger, on a machine
  # nobody here controls, from a genuinely clean checkout. It is the only
  # job whose failure means "the front door is broken" rather than "a test
  # regressed", so it deliberately shares nothing with the others: no
  # vendored-dependency cache, no restored build tree, no toolchain beyond
  # the C compiler. If it needs something the README does not mention, that
  # is the bug.
  #
  # It also does work no local run can do. The pinned roots in
  # tools/dev/arena_demo.sh were produced on the maintainer's host; this job
  # re-derives them on a different machine, a different CPU and a fresh
  # userland every push, which is the cross-machine half of the
  # reproducibility claim docs/ARENA.md makes.
  #
  # Kernel confinement is NOT assumed. arena_runner exits 3 when Landlock or
  # seccomp is unavailable and the demo then falls back to an unconfined run
  # and says so; the roots are identical either way because confinement
  # bounds a pilot process and is not an input to the simulation. So this
  # job is honest on a runner image that has Landlock and on one that does
  # not, without either weakening an assertion or pinning us to a kernel.
  arena:
    name: arena (make arena-demo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-14
          # Same -std=c23 reason as every other job here: ubuntu-latest's
          # default gcc (13) rejects the `c23` spelling outright.
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --set cc /usr/bin/gcc-14
          gcc --version

      # The demo asserts the pinned roots, the replay re-simulation, and the
      # named refusal of a tampered control byte on its own, and exits
      # non-zero on any of them — so running it IS the gate.
      - name: make arena-demo
        run: make arena-demo

      # Stale artwork is a documentation lie with a long half-life: the SVG
      # carries the seed, the pilot identities and both roots, so a reader
      # checks the picture against numbers it claims to depict.
      - name: make arena-svg-check
        run: make arena-svg-check

      - name: make arena-demo-opt-parity
        run: make arena-demo-opt-parity
