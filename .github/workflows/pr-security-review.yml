# Automated security review.
#
# Runs on every pull request, including from forks. Security model:
#   - `pull_request_target` loads this workflow from the trusted base branch;
#   - explicit read-only permissions expose no write token or repository secret;
#   - checkout stays at the base SHA and the base scanner reads the proposed
#     Git objects only as data; no pull-request script or executable is run;
#   - the pass/fail check and bounded log are the complete output.
name: PR Security Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read          # minimal; intentionally NO write, NO secrets

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: [self-hosted, linux, x64, z23-pr-scan]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false      # never hand git credentials to the job

      - name: Run security scan (diff + grep only — no PR code is executed)
        run: |
          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin \
            'refs/pull/${{ github.event.pull_request.number }}/head'
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD"
          set +e
          bash tools/scripts/pr_security_scan.sh "$BASE" "$HEAD" > scan.txt 2>&1
          echo $? > scan.code
          cat scan.txt

      - name: Enforce — fail the check on HIGH-severity findings
        if: always()
        run: exit "$(cat scan.code)"
