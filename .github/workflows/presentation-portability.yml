# Cross-platform proof for the reusable libzclpresentation source package.
# It intentionally builds no node code and uses no secrets or write token.

name: Presentation portability

on:
  push:
    branches: [main]
    paths:
      - 'lib/presentation/**'
      - 'lib/encoding/src/qr.c'
      - 'lib/encoding/src/qrcodegen_backend.c'
      - 'vendor/rgfw/**'
      - 'vendor/qrcodegen/**'
      - 'vendor/typography/**'
      - '.github/workflows/presentation-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link:
    name: libzclpresentation (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: [self-hosted, linux, x64, z23-platform]
            libs: -ldl -lm
          - name: Windows
            runner: [self-hosted, windows, x64, z23-platform]
            libs: -luser32 -lgdi32 -lshell32 -lole32
          - name: macOS
            runner: [self-hosted, macos, arm64, z23-platform]
            libs: -framework Cocoa -framework CoreGraphics -framework QuartzCore -framework CoreVideo
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Linux native API headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxi-dev libxrandr-dev

      - name: Strict C compile and native link
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/presentation-ci
          clang -std=c2x -O2 -Wall -Wextra -Werror -pedantic \
            -Ilib/presentation/include \
            lib/presentation/src/presentation.c \
            lib/presentation/src/presentation_canvas_select.c \
            lib/presentation/src/presentation_focus.c \
            lib/presentation/src/presentation_form.c \
            lib/presentation/src/presentation_input.c \
            lib/presentation/src/canvas.c \
            lib/presentation/src/zclassic_brand.c \
            lib/presentation/examples/bitmap_demo.c \
            ${{ matrix.libs }} \
            -o build/presentation-ci/bitmap-demo
          clang -std=c2x -O2 -Wall -Wextra -Werror -pedantic \
            -c vendor/qrcodegen/qrcodegen.c \
            -o build/presentation-ci/qrcodegen.o
