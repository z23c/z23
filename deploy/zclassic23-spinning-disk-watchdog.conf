#
# Rotating disks can block the main node thread for more than two minutes
# during bounded integrity reads, and the stock two-minute watchdog SIGABRTs
# a node that is doing honest work. Ten minutes buys that work room.
#
# ── What this number is, and what it is NOT ────────────────────────────────
# WatchdogSec is a pure DURATION. It measures nothing about the node: not its
# disk counters, not its boot stage, not whether it is advancing. It cannot
# distinguish a slow box from a wedged one, and on a box slow enough ten
# minutes does exactly what two minutes did. Read this file as an ABSOLUTE
# CEILING — a wedge backstop that converts a genuine freeze into a bounded
# restart — and never as evidence that progress was measured.
#
# The thing that actually measures progress sits UNDERNEATH this ceiling and
# renews the deadline long before it is reached: the pet thread in
# config/src/boot_sd_watchdog.c sends WATCHDOG=1 every WatchdogSec/4, gated on
# freshness of `boot_progress_last_us()` plus the runtime pillars and the root
# supervisor sweep. A node that keeps publishing a named boot-stage marker
# renews indefinitely and never reaches the ceiling, however slow its disk.
#
# ── The gap this ceiling is currently covering for ─────────────────────────
# That renewal is driven by NAMED STAGE MARKERS, not by an I/O observable. A
# long blocking read that publishes no boot_progress marker renews nothing,
# and only the ceiling keeps the node alive. So do not raise this number again
# when a slow box still gets killed: the fix is to renew on observed disk
# progress (an evidence probe over the process's own block-I/O counters), so
# that a box doing measurable work never reaches the ceiling regardless of how
# long the work takes. Raising the ceiling is the same defect with a bigger
# number.
#
# PARTLY CLOSED. The three STEADY-STATE runtime pillars — the connman message
# pump, the connman dial scheduler, and the supervisor tick runner — now renew
# on explicit evidence. Each thread is checked for advancing CPU time, major
# faults or block-I/O bytes (platform/os_proc.h os_proc_thread_work_read). A
# dial operation also publishes its own bounded-wait deadline before entering
# a potentially silent Tor wait. The deadline admits that intended wait but
# expires if the operation overruns its declared budget; an undeclared or
# expired silent wait is still killed on schedule.
#
# STILL OPEN: the BOOT window. Before connman starts and before the tick runner
# is up, renewal rests on boot_progress alone, so a long blocking read during
# boot that publishes no named stage marker is still covered by this ceiling
# and nothing else. That remains the reason this number is 10min and not 120s.
# The same rule applies to closing it: renew on evidence, never on a bigger
# number.
#
# Do not use this drop-in to hide a process whose disk counters AND named boot
# stage have both stopped moving. That is silence, and silence is the one
# thing the ceiling exists to act on.
[Service]
WatchdogSec=10min
