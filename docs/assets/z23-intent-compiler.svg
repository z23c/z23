<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="compiler-title compiler-desc">
  <title id="compiler-title">The intent compilation model Z23 is building</title>
  <desc id="compiler-desc">Seven stages form a loop: stories, ontology, predicates, focus, heuristics, evidence, and experience. Experience feeds the user's observed result into the next story. The diagram explicitly labels this as a model being built, not a finished monolithic compiler.</desc>
  <defs>
    <marker id="compiler-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#69748a"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#0a0d12"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="480" y="52" text-anchor="middle" font-size="30" font-weight="750" fill="#e9eef6">Compiling intent into experience</text>
    <rect x="258" y="72" width="444" height="34" rx="17" fill="#171d2a" stroke="#f0b44c"/>
    <text x="480" y="95" text-anchor="middle" font-size="14" font-weight="750" letter-spacing="1" fill="#f7d28a">MODEL BEING BUILT · NOT A FINISHED MONOLITHIC COMPILER</text>

    <path d="M224 206 H260" stroke="#69748a" stroke-width="3" marker-end="url(#compiler-arrow)"/>
    <path d="M454 206 H490" stroke="#69748a" stroke-width="3" marker-end="url(#compiler-arrow)"/>
    <path d="M684 206 H720" stroke="#69748a" stroke-width="3" marker-end="url(#compiler-arrow)"/>
    <path d="M817 284 V344" stroke="#69748a" stroke-width="3" marker-end="url(#compiler-arrow)"/>
    <path d="M720 432 H684" stroke="#69748a" stroke-width="3" marker-end="url(#compiler-arrow)"/>
    <path d="M490 432 H454" stroke="#69748a" stroke-width="3" marker-end="url(#compiler-arrow)"/>

    <rect x="30" y="132" width="194" height="152" rx="18" fill="#121722" stroke="#5ea8ff" stroke-width="2"/>
    <text x="54" y="163" font-size="14" font-weight="800" fill="#5ea8ff">01</text>
    <text x="127" y="202" text-anchor="middle" font-size="24" font-weight="750" fill="#e9eef6">STORIES</text>
    <text x="127" y="235" text-anchor="middle" font-size="16" fill="#c3ccd9">desired behavior</text>
    <text x="127" y="260" text-anchor="middle" font-size="14" fill="#97a3b6">in the user's words</text>

    <rect x="260" y="132" width="194" height="152" rx="18" fill="#121722" stroke="#a78bfa" stroke-width="2"/>
    <text x="284" y="163" font-size="14" font-weight="800" fill="#a78bfa">02</text>
    <text x="357" y="202" text-anchor="middle" font-size="24" font-weight="750" fill="#e9eef6">ONTOLOGY</text>
    <text x="357" y="235" text-anchor="middle" font-size="16" fill="#c3ccd9">stable domain names</text>
    <text x="357" y="260" text-anchor="middle" font-size="14" fill="#97a3b6">and relationships</text>

    <rect x="490" y="132" width="194" height="152" rx="18" fill="#121722" stroke="#3ddc97" stroke-width="2"/>
    <text x="514" y="163" font-size="14" font-weight="800" fill="#3ddc97">03</text>
    <text x="587" y="202" text-anchor="middle" font-size="22" font-weight="750" fill="#e9eef6">PREDICATES</text>
    <text x="587" y="235" text-anchor="middle" font-size="16" fill="#c3ccd9">checkable conditions</text>
    <text x="587" y="260" text-anchor="middle" font-size="14" fill="#97a3b6">for success or refusal</text>

    <rect x="720" y="132" width="194" height="152" rx="18" fill="#121722" stroke="#f0b44c" stroke-width="2"/>
    <text x="744" y="163" font-size="14" font-weight="800" fill="#f0b44c">04</text>
    <text x="817" y="202" text-anchor="middle" font-size="24" font-weight="750" fill="#e9eef6">FOCUS</text>
    <text x="817" y="235" text-anchor="middle" font-size="16" fill="#c3ccd9">bounded context</text>
    <text x="817" y="260" text-anchor="middle" font-size="14" fill="#97a3b6">for the work at hand</text>

    <rect x="720" y="356" width="194" height="152" rx="18" fill="#121722" stroke="#f2708a" stroke-width="2"/>
    <text x="744" y="387" font-size="14" font-weight="800" fill="#f2708a">05</text>
    <text x="817" y="426" text-anchor="middle" font-size="22" font-weight="750" fill="#e9eef6">HEURISTICS</text>
    <text x="817" y="459" text-anchor="middle" font-size="16" fill="#c3ccd9">replaceable workers</text>
    <text x="817" y="484" text-anchor="middle" font-size="14" fill="#97a3b6">propose a change</text>

    <rect x="490" y="356" width="194" height="152" rx="18" fill="#121722" stroke="#3ddc97" stroke-width="2"/>
    <text x="514" y="387" font-size="14" font-weight="800" fill="#3ddc97">06</text>
    <text x="587" y="426" text-anchor="middle" font-size="24" font-weight="750" fill="#e9eef6">EVIDENCE</text>
    <text x="587" y="459" text-anchor="middle" font-size="16" fill="#c3ccd9">exact observations</text>
    <text x="587" y="484" text-anchor="middle" font-size="14" fill="#97a3b6">bound to roots</text>

    <rect x="260" y="356" width="194" height="152" rx="18" fill="#171d2a" stroke="#5ea8ff" stroke-width="3"/>
    <text x="284" y="387" font-size="14" font-weight="800" fill="#5ea8ff">07</text>
    <text x="357" y="426" text-anchor="middle" font-size="22" font-weight="750" fill="#e9eef6">EXPERIENCE</text>
    <text x="357" y="459" text-anchor="middle" font-size="16" fill="#b9d9ff">the real consequence</text>
    <text x="357" y="484" text-anchor="middle" font-size="14" fill="#97a3b6">the user can see</text>

    <path d="M357 508 V570 H127 V304" fill="none" stroke="#5ea8ff" stroke-width="3" marker-end="url(#compiler-arrow)"/>
    <rect x="180" y="548" width="220" height="44" rx="22" fill="#171d2a" stroke="#5ea8ff"/>
    <text x="290" y="576" text-anchor="middle" font-size="15" font-weight="750" fill="#b9d9ff">EXPERIENCE FEEDS THE NEXT STORY</text>

    <text x="480" y="637" text-anchor="middle" font-size="17" fill="#97a3b6">Present primitives are becoming one inspectable, evidence-bound journey.</text>
  </g>
</svg>
