<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="journey-title journey-desc">
  <title id="journey-title">Describe, reuse, create, see, keep, share</title>
  <desc id="journey-desc">The Z23 product journey flows from describing desired behavior through reuse and creation into a large central SEE stage, where the user observes the real result before keeping and sharing an exact version.</desc>
  <defs>
    <marker id="journey-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#69748a"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#0a0d12"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="480" y="54" text-anchor="middle" font-size="30" font-weight="750" fill="#e9eef6">From intent to owned software</text>
    <text x="480" y="84" text-anchor="middle" font-size="17" fill="#97a3b6">The user sees the consequence before choosing what to keep.</text>

    <path d="M292 171 H337" stroke="#69748a" stroke-width="3" marker-end="url(#journey-arrow)"/>
    <path d="M623 171 H668" stroke="#69748a" stroke-width="3" marker-end="url(#journey-arrow)"/>
    <path d="M788 239 C788 276 699 292 655 313" fill="none" stroke="#69748a" stroke-width="3" marker-end="url(#journey-arrow)"/>
    <path d="M376 444 C331 466 273 480 250 502" fill="none" stroke="#69748a" stroke-width="3" marker-end="url(#journey-arrow)"/>
    <path d="M402 548 H548" stroke="#69748a" stroke-width="3" marker-end="url(#journey-arrow)"/>

    <rect x="45" y="116" width="247" height="123" rx="16" fill="#121722" stroke="#5ea8ff" stroke-width="2"/>
    <text x="69" y="149" font-size="15" font-weight="750" letter-spacing="1.4" fill="#5ea8ff">01</text>
    <text x="168.5" y="183" text-anchor="middle" font-size="25" font-weight="750" fill="#e9eef6">DESCRIBE</text>
    <text x="168.5" y="214" text-anchor="middle" font-size="16" fill="#c3ccd9">Say what should happen.</text>

    <rect x="337" y="116" width="286" height="123" rx="16" fill="#121722" stroke="#3ddc97" stroke-width="2"/>
    <text x="361" y="149" font-size="15" font-weight="750" letter-spacing="1.4" fill="#3ddc97">02</text>
    <text x="480" y="183" text-anchor="middle" font-size="25" font-weight="750" fill="#e9eef6">REUSE</text>
    <text x="480" y="214" text-anchor="middle" font-size="16" fill="#c3ccd9">Find useful C23 first.</text>

    <rect x="668" y="116" width="247" height="123" rx="16" fill="#121722" stroke="#a78bfa" stroke-width="2"/>
    <text x="692" y="149" font-size="15" font-weight="750" letter-spacing="1.4" fill="#a78bfa">03</text>
    <text x="791.5" y="183" text-anchor="middle" font-size="25" font-weight="750" fill="#e9eef6">CREATE</text>
    <text x="791.5" y="214" text-anchor="middle" font-size="16" fill="#c3ccd9">Write only what is missing.</text>

    <rect x="244" y="294" width="472" height="160" rx="24" fill="#171d2a" stroke="#f0b44c" stroke-width="4"/>
    <rect x="266" y="312" width="136" height="32" rx="16" fill="#f0b44c"/>
    <text x="334" y="334" text-anchor="middle" font-size="14" font-weight="800" fill="#0a0d12">DECISION POINT</text>
    <text x="480" y="383" text-anchor="middle" font-size="48" font-weight="800" fill="#e9eef6">SEE</text>
    <text x="480" y="416" text-anchor="middle" font-size="19" fill="#f7d28a">Run the real result. Watch what changed.</text>
    <text x="684" y="329" text-anchor="end" font-size="15" font-weight="750" letter-spacing="1.4" fill="#f0b44c">04</text>

    <rect x="78" y="502" width="324" height="90" rx="16" fill="#121722" stroke="#f2708a" stroke-width="2"/>
    <text x="102" y="535" font-size="15" font-weight="750" letter-spacing="1.4" fill="#f2708a">05</text>
    <text x="240" y="543" text-anchor="middle" font-size="25" font-weight="750" fill="#e9eef6">KEEP</text>
    <text x="240" y="572" text-anchor="middle" font-size="15" fill="#c3ccd9">Accept one exact version locally.</text>

    <rect x="548" y="502" width="334" height="90" rx="16" fill="#121722" stroke="#3ddc97" stroke-width="2"/>
    <text x="572" y="535" font-size="15" font-weight="750" letter-spacing="1.4" fill="#3ddc97">06</text>
    <text x="715" y="543" text-anchor="middle" font-size="25" font-weight="750" fill="#e9eef6">SHARE</text>
    <text x="715" y="572" text-anchor="middle" font-size="15" fill="#c3ccd9">Let peers verify and reproduce it.</text>
  </g>
</svg>
