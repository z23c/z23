<svg xmlns="http://www.w3.org/2000/svg" width="905" height="651" viewBox="0 0 905 651" role="img" aria-label="how the bytes travel">
<rect width="905" height="651" rx="12" fill="#0b0f16"/>
<rect x="0.5" y="0.5" width="904" height="650" rx="11.5" fill="none" stroke="#243044"/>
<path d="M0 44 h905" stroke="#1a2432"/>
<circle cx="26" cy="22" r="5.5" fill="#ff6b5e"/><circle cx="46" cy="22" r="5.5" fill="#f2c14e"/><circle cx="66" cy="22" r="5.5" fill="#6bd18a"/>
<text x="452" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#66788c" text-anchor="middle">how the bytes travel</text>
<text y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="747.6" lengthAdjust="spacing" fill="#c3d2e2">  NODE A — the person's workshop                NODE B — a second node, nothing installed</tspan></text>
<text y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="714.0" lengthAdjust="spacing" fill="#c3d2e2">  ┌───────────────────────────────────┐         ┌───────────────────────────────────┐</tspan></text>
<text y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="714.0" lengthAdjust="spacing" fill="#c3d2e2">  │ workspace  the accepted work      │         │ store      empty at boot          │</tspan></text>
<text y="139" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="714.0" lengthAdjust="spacing" fill="#c3d2e2">  │ store      the bytes it holds     │         │ installed  empty at boot          │</tspan></text>
<text y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="714.0" lengthAdjust="spacing" fill="#c3d2e2">  │ swarm      serves what it holds   │         │ swarm      serves what it verified│</tspan></text>
<text y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="714.0" lengthAdjust="spacing" fill="#c3d2e2">  └───────────────────────────────────┘         └───────────────────────────────────┘</tspan></text>
<text y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"></text>
<text y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="764.4" lengthAdjust="spacing" fill="#c3d2e2">   1 PUBLISH    zcode.package.publish.commit     accepted source becomes one signed carrier</tspan></text>
<text y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="714.0" lengthAdjust="spacing" fill="#c3d2e2">   2 ANNOUNCE   zcode.network.publish            POINTER: package root → carrier root</tspan></text>
<text y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="764.4" lengthAdjust="spacing" fill="#c3d2e2">                                                 PROVIDER: an authenticated peer holding it</tspan></text>
<text y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="772.8" lengthAdjust="spacing" fill="#c3d2e2">   3 DISCOVER   zcode.network.find               node B asks the overlay who holds that root</tspan></text>
<text y="307" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="756.0" lengthAdjust="spacing" fill="#c3d2e2">   4 FETCH      zcode.package.fetch              bytes arrive from node A — and stay inert</tspan></text>
<text y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="739.2" lengthAdjust="spacing" fill="#c3d2e2">   5 REPRODUCE  zcode.package.source.reproduce   node B re-derives the exact source tree</tspan></text>
<text y="349" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="798.0" lengthAdjust="spacing" fill="#c3d2e2">   6 USE        zcode.package.dev.use            node B admits it — an explicit local decision;</tspan></text>
<text y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="814.8" lengthAdjust="spacing" fill="#c3d2e2">                                                 its worker builds the library AND bin/wordcount,</tspan></text>
<text y="391" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="781.2" lengthAdjust="spacing" fill="#c3d2e2">                                                 both under one build receipt, and hands back</tspan></text>
<text y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="512.4" lengthAdjust="spacing" fill="#c3d2e2">                                                 "run &lt;path&gt;"</tspan></text>
<text y="433" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="462.0" lengthAdjust="spacing" fill="#c3d2e2">   7 CHECKOUT   zcode.workspace.source.package.checkout</tspan></text>
<text y="454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="781.2" lengthAdjust="spacing" fill="#c3d2e2">                                                 carrier → the accepted source, byte for byte</tspan></text>
<text y="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="730.8" lengthAdjust="spacing" fill="#c3d2e2">   8 SERVE      node B answers for the same roots, so the next peer need not ask node A</tspan></text>
<text y="496" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"></text>
<text y="517" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="856.8" lengthAdjust="spacing" fill="#c3d2e2">   9 EXPORT     zcode.package.fastobj.export     node B's compile cache leaves as one ordinary package</tspan></text>
<text y="538" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="856.8" lengthAdjust="spacing" fill="#c3d2e2">  10 CARRY      zcode.package.fetch              the carrier crosses B → C, the publisher already gone</tspan></text>
<text y="559" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="747.6" lengthAdjust="spacing" fill="#c3d2e2">  11 ADMIT      zcode.package.fastobj.admit      node C unpacks a cache it never compiled</tspan></text>
<text y="580" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="730.8" lengthAdjust="spacing" fill="#c3d2e2">  12 REBUILD    zcode.package.reproduce          zero compilers, byte-identical receipt</tspan></text>
<text y="601" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"></text>
<text y="622" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="697.2" lengthAdjust="spacing" fill="#c3d2e2">  no registry · no coordinator · no privileged node · central services contacted: 0</tspan></text>
</svg>
