<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="verification-title verification-desc">
  <title id="verification-title">Inert transfer, independent verification, local acceptance</title>
  <desc id="verification-desc">An exact source object leaves one node as a sealed inert package. Across the network it has no execution authority. A receiving node independently checks roots and signatures, performs locally admitted bounded reproduction, and lets local policy accept or refuse that exact version.</desc>
  <defs>
    <pattern id="verification-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#202836" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="600" fill="#090c11"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="61" font-size="17" font-weight="750" letter-spacing="2.2" fill="#3ddc97">VERIFY, DON'T TRUST</text>
    <text x="54" y="105" font-size="36" font-weight="780" fill="#e9eef6">Bytes can travel. Authority cannot.</text>

    <g transform="translate(62 173)">
      <path d="M0 38L74 0L148 38V130L74 168L0 130Z" fill="#10243b" stroke="#5ea8ff" stroke-width="3"/>
      <path d="M0 38L74 78L148 38M74 78V168" fill="none" stroke="#5ea8ff" stroke-width="2" opacity="0.7"/>
      <path d="M28 49L74 24L120 49L74 73Z" fill="#172e49" stroke="#b9d9ff"/>
      <text x="74" y="112" text-anchor="middle" font-size="14" font-weight="800" fill="#e9eef6">EXACT</text>
      <text x="74" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#e9eef6">SOURCE</text>
    </g>
    <text x="136" y="377" text-anchor="middle" font-size="13" font-weight="750" letter-spacing="1.4" fill="#5ea8ff">SOURCE NODE</text>
    <text x="136" y="402" text-anchor="middle" font-size="14" fill="#97a3b6">root · dependencies · claim</text>

    <path d="M225 257H583" stroke="#2d3747" stroke-width="2" stroke-dasharray="7 9"/>
    <path d="M225 257H583" stroke="#a78bfa" stroke-width="2" stroke-dasharray="2 23"/>
    <g transform="translate(339 205)">
      <path d="M0 22L45 0L90 22V78L45 100L0 78Z" fill="#171421" stroke="#a78bfa" stroke-width="3"/>
      <path d="M0 22L45 46L90 22M45 46V100" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
      <circle cx="45" cy="52" r="14" fill="#090c11" stroke="#f0b44c" stroke-width="2"/>
      <path d="M39 49V44A6 6 0 0 1 51 44V49M36 49H54V63H36Z" fill="none" stroke="#f0b44c" stroke-width="2"/>
    </g>
    <text x="384" y="333" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1.5" fill="#d8cdfd">INERT FETCH</text>
    <text x="384" y="359" text-anchor="middle" font-size="14" fill="#97a3b6">no build · no install · no run</text>

    <circle cx="676" cy="257" r="124" fill="#0c1218" stroke="#3ddc97" stroke-width="3"/>
    <circle cx="676" cy="257" r="94" fill="url(#verification-grid)" stroke="#294a40" stroke-width="1.5"/>
    <path d="M607 202H694M607 218H669M607 234H710" stroke="#5ea8ff" stroke-width="4"/>
    <path d="M607 274H694M607 290H669M607 306H710" stroke="#a78bfa" stroke-width="4"/>
    <path d="M722 202L738 218L766 187" fill="none" stroke="#3ddc97" stroke-width="7"/>
    <path d="M722 274L738 290L766 259" fill="none" stroke="#3ddc97" stroke-width="7"/>
    <text x="676" y="341" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.4" fill="#86edbd">INDEPENDENT REPRODUCTION</text>
    <path d="M764 345L840 422" stroke="#3ddc97" stroke-width="14" stroke-linecap="round"/>
    <path d="M764 345L840 422" stroke="#86edbd" stroke-width="4" stroke-linecap="round"/>

    <path d="M833 423V471" stroke="#69748a" stroke-width="2"/>
    <path d="M743 493H897" stroke="#313b4e" stroke-width="12" stroke-linecap="round"/>
    <path d="M820 493H897" stroke="#3ddc97" stroke-width="12" stroke-linecap="round"/>
    <circle cx="820" cy="493" r="22" fill="#090c11" stroke="#f0b44c" stroke-width="4"/>
    <text x="743" y="535" font-size="13" font-weight="760" letter-spacing="1.2" fill="#f2708a">REFUSE</text>
    <text x="897" y="535" text-anchor="end" font-size="13" font-weight="760" letter-spacing="1.2" fill="#3ddc97">ACCEPT</text>
    <text x="820" y="568" text-anchor="middle" font-size="15" font-weight="760" fill="#f7d28a">LOCAL POLICY + USER</text>

    <g transform="translate(68 477)">
      <path d="M0 0H518" stroke="#313b4e"/>
      <text x="0" y="34" font-size="14" font-weight="750" letter-spacing="1.2" fill="#f2708a">EVIDENCE HAS A BOUNDARY</text>
      <text x="0" y="62" font-size="16" fill="#c3ccd9">A receipt proves its stated observation—nothing more.</text>
    </g>
  </g>
</svg>
